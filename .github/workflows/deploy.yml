name: Déploiement

# Première CI du repo. Elle est volontairement minimale : elle vérifie ce qui
# est vérifiable en machine (la logique de temps) puis publie. L'ergonomie se
# valide au téléphone, aucune étape ici ne prétend la couvrir.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un push plus récent annule celui en vol.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typage
        run: pnpm typecheck

      # Le gate qui compte : rien ne se déploie si la logique de temps régresse.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publier sur Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
