<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#101014" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>myChess — pendule</title>
  </head>
  <body>
    <!--
      R5 : deux moitiés horizontales, celle de l'adversaire pivotée à 180°.
      R6 : chaque moitié est entièrement une zone de tap — aucun contrôle
      secondaire à l'intérieur ; l'horloge est purement décorative pour le
      pointeur (`pointer-events: none` en CSS).
    -->
    <main id="app">
      <button type="button" class="half" id="half-top" aria-label="Moitié haute">
        <!-- R36 : le camp est écrit une fois le premier tap passé, jamais avant. -->
        <span class="side" id="side-top" hidden></span>
        <span class="clock" id="clock-top">0:00</span>
      </button>

      <!-- R10 : bande centrale étroite, hors des deux zones de tap. -->
      <div class="band" id="band">
        <button type="button" class="band-button" id="undo-button" aria-label="Annuler le dernier coup">
          ⟲
        </button>
        <!-- Libellé et rôle suivent l'état : réglages à l'arrêt, pause en partie. -->
        <button type="button" class="band-button" id="menu-button" aria-label="Réglages">
          Réglages
        </button>
      </div>

      <button type="button" class="half" id="half-bottom" aria-label="Moitié basse">
        <span class="side" id="side-bottom" hidden></span>
        <span class="clock" id="clock-bottom">0:00</span>
      </button>
    </main>

    <!-- R11 : le reset n'est atteignable que d'ici, jamais en un seul geste. -->
    <div class="overlay" id="overlay" hidden>
      <section class="panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <h1 class="panel-title" id="overlay-title">Pause</h1>
        <p class="panel-hint" id="overlay-hint"></p>

        <label class="field" id="preset-field">
          <span class="field-label">Cadence</span>
          <select id="preset-select"></select>
        </label>

        <!-- Révélé par la seule entrée « Personnalisée… » du select ci-dessus :
             l'accueil reste identique tant qu'on ne la choisit pas. -->
        <div class="fields" id="custom-fields" hidden>
          <label class="field" id="custom-time-field">
            <span class="field-label">Temps (min)</span>
            <input
              class="number-input"
              type="number"
              id="custom-minutes"
              inputmode="numeric"
              min="1"
              max="180"
              step="1"
            />
          </label>

          <label class="field field--row">
            <input type="checkbox" id="custom-handicap" />
            <span class="field-label">Handicap — un temps par camp</span>
          </label>

          <!-- R4 exposé. Cocher remplace le champ unique plutôt que de s'y
               ajouter : deux temps affichés en même temps ne diraient pas
               lequel s'applique. -->
          <div class="field-pair" id="custom-handicap-fields" hidden>
            <label class="field">
              <span class="field-label">Blancs (min)</span>
              <input
                class="number-input"
                type="number"
                id="custom-white"
                inputmode="numeric"
                min="1"
                max="180"
                step="1"
              />
            </label>
            <label class="field">
              <span class="field-label">Noirs (min)</span>
              <input
                class="number-input"
                type="number"
                id="custom-black"
                inputmode="numeric"
                min="1"
                max="180"
                step="1"
              />
            </label>
          </div>

          <label class="field">
            <span class="field-label">Incrément (s)</span>
            <input
              class="number-input"
              type="number"
              id="custom-increment"
              inputmode="numeric"
              min="0"
              max="180"
              step="1"
            />
          </label>

          <div class="field" role="radiogroup" aria-label="Mode de cadence">
            <span class="field-label">Mode</span>
            <label class="field--row">
              <input type="radio" name="custom-mode" value="fischer" id="custom-mode-fischer" />
              <span>Fischer</span>
            </label>
            <label class="field--row">
              <input type="radio" name="custom-mode" value="bronstein" id="custom-mode-bronstein" />
              <span>Bronstein</span>
            </label>
          </div>
        </div>

        <label class="field field--row">
          <input type="checkbox" id="silent-toggle" />
          <span class="field-label">Mode silencieux</span>
        </label>

        <!-- R37 : facultatif, et donc hors du chemin qui ouvre une partie. Il ne
             vit que sur l'accueil : un tirage n'a de sens qu'avant de jouer. -->
        <div class="field" id="draw-field">
          <span class="field-label">Tirage des couleurs — la couleur sortie va à qui appuie</span>
          <button type="button" class="action" id="draw-button">Tirer au sort</button>
          <p class="draw-result" id="draw-result" hidden></p>
        </div>

        <div class="actions">
          <button type="button" class="action action--primary" id="resume-button">Reprendre</button>
          <button type="button" class="action" id="export-button">Exporter le journal</button>
          <button type="button" class="action action--danger" id="reset-button">Nouvelle partie</button>
        </div>

        <p class="panel-note" id="overlay-note"></p>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
